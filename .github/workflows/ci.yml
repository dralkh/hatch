name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test app and providers
        run: npm test

      - name: Exercise offline CLI pipeline
        run: python3 hatch.py --self-test

      - name: Build container
        run: docker build --tag hatch:ci .

      - name: Smoke-test container
        shell: bash
        run: |
          container_id=$(docker run --detach hatch:ci)
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if docker exec "$container_id" node -e "fetch('http://127.0.0.1:3000/').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          exit 1
